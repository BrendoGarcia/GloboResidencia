name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: FrontEnd
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: FrontEnd/package-lock.json
      - run: npm ci
      - run: npm run build

  python-dependencies:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - BackEndAPIgeral
          - BackEndAnalises
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        working-directory: ${{ matrix.service }}
        run: pip install -r dependencias.txt || pip install -r dependecias.txt
      - name: Compile Python
        working-directory: ${{ matrix.service }}
        run: python -m compileall -q .
